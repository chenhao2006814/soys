<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>多源聚合搜索</title>
<script src="./supabase.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
    <div style="position:absolute; right:0; top:0; z-index:10;">
        <div id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="category-dropdown" id="catDrop">
            <div class="category-item" data-type="video">影视源</div>
            <div class="category-item" data-type="pan">网盘源</div>
            <div class="category-item" data-type="magnet">磁力源</div>
        </div>
    </div>
    <h1>多源聚合搜索</h1>
    <div class="tip-text">聚合搜索源 · 一键检索</div>
</header>
<div class="search-wrap">
    <input id="kw" placeholder="输入关键词搜索">
    <span class="clear-kw" id="clearKw">×</span>
    <button id="searchBtn">搜索</button>
</div>
<div class="top-bar">
    <button class="btn" id="sourceManageBtn">源添加</button>
    <button class="btn" id="adminLoginBtn">游客</button>
</div>
<div class="source-grid" id="sourceGrid"></div>
<div class="mask" id="addMask">
    <div class="modal">
        <h3>添加搜索源</h3>
        <div class="limit-tip" id="addLimitTip">今日剩余添加：5次</div>
        <div class="input-row">
            <input type="text" id="addName" placeholder="源名称（不可重复）">
            <select id="addSourceType">
                <option value="video">影视源</option>
                <option value="pan">网盘源</option>
                <option value="magnet">磁力源</option>
            </select>
        </div>
        <input type="text" id="addHome" placeholder="首页地址（http/https开头）">
        <input type="text" id="addSearch" placeholder="搜索页地址，关键词使用{kw}替换">
        <div class="btn-group">
            <button class="btn" id="cancelAdd">取消</button>
            <button class="btn" id="confirmAdd">确认添加</button>
        </div>
    </div>
</div>
<div class="mask" id="loginMask">
    <div class="modal">
        <h3>登录</h3>
        <div class="pwd-wrap">
            <input type="password" id="adminPwd" placeholder="输入管理员密码">
            <span class="pwd-eye" id="pwdEye">👁</span>
        </div>
        <div class="btn-group">
            <button class="btn" id="cancelLogin">取消</button>
            <button class="btn" id="confirmLogin">登录</button>
        </div>
    </div>
</div>
<div class="mask" id="editMask">
    <div class="modal">
        <h3>编辑搜索源</h3>
        <div class="input-row">
            <input type="text" id="editName" placeholder="源名称">
            <select id="editSourceType">
                <option value="video">影视源</option>
                <option value="pan">网盘源</option>
                <option value="magnet">磁力源</option>
            </select>
        </div>
        <input type="text" id="editHome" placeholder="首页地址">
        <input type="text" id="editSearch" placeholder="搜索页地址">
        <input type="hidden" id="editDbId">
        <div class="btn-group">
            <button class="btn" id="cancelEdit">取消</button>
            <button class="btn" id="confirmEdit">保存</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>
<footer>
    <span id="visitorTxt">今日访客：0人</span>
    &nbsp;|&nbsp;
    <span id="addTotalTxt">游客今日新增源：0</span>
    &nbsp;|&nbsp;
    <span id="loadTxt">页面加载：0.00s</span>
</footer>
<div id="debugBox">【调试日志启动】\n</div>

<script src="./main.js"></script>
</body>
</html>
